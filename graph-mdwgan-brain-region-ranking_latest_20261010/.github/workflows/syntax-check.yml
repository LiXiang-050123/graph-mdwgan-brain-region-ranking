name: syntax-check

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependency
        run: python -m pip install numpy
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Verify corrected consensus weighting
        run: python tests/test_consensus_gnn_weighting.py
